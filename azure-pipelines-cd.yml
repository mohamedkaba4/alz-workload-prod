trigger:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.13.3'
  serviceConnection: 'sc-alz-workload-prod-apply'

jobs:
  - deployment: ApplyProd
    displayName: 'Apply Production Workload'
    environment: 'alz-workload-prod-apply'

    pool:
      vmImage: ubuntu-latest

    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - bash: |
                wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
                unzip terraform_$(terraformVersion)_linux_amd64.zip
                sudo mv terraform /usr/local/bin/
                terraform version
              displayName: 'Install Terraform'

            - task: AzureCLI@2
              displayName: 'Terraform Apply'
              inputs:
                azureSubscription: '$(serviceConnection)'
                scriptType: bash
                scriptLocation: inlineScript
                addSpnToEnvironment: true
                inlineScript: |
                  export ARM_USE_OIDC=true
                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_TENANT_ID=$tenantId
                  export ARM_OIDC_TOKEN=$idToken

                  terraform init

                  terraform plan \
                    -input=false \
                    -var-file="prod.tfvars" \
                    -out="prod.tfplan"

                  terraform apply -auto-approve prod.tfplan