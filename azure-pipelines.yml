trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  serviceConnection: 'sc-alz-workload-prod-plan'
  terraformVersion: '1.13.3'

steps: 
    - checkout: self
    - bash: |
        wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: 'Install Terraform'

    - task: AzureCLI@2
      displayName: 'Run Workload Plan'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_OIDC_TOKEN=$idToken
        
          terraform fmt -check
          terraform init
          terraform validate
          echo "=== CURRENT BRANCH ==="
          git branch --show-current

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== PROD TFVARS ==="
          cat prod.tfvars
          terraform plan \
            -input=false \
            -var-file="prod.tfvars" \
            -out="prod.tfplan"
